name: CI

# Every push and every pull request, on every branch.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The oldest supported version and the current LTS.
        node-version: [18.x, lts/*]
    env:
      # Enables test/repo/network.test.js (fetch a pinned commit from a real remote).
      # A plain `npm test` on a developer machine leaves these skipped.
      MORF_NETWORK_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Includes test/util/portable-hash.test.js: all three systems must compute the
      # same lockfile hash as the constant stored in the repository.
      - run: npm test
